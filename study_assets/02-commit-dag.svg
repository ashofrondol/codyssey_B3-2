<path class="ln ln-red dash" d="M116,288 L116,400 L836,400 L836,164 L820,164" marker-end="url(#arrow-red)"/>
<rect class="bg" x="230" y="386" width="408" height="28"/>
<text x="434" y="405" text-anchor="middle" class="ts c-red">✗ 옛 커밋이 새 커밋을 부모로? — 생길 수 없음(사이클)</text>
