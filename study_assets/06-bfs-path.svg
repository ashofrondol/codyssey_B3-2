<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
<title id="title">PATH 8690126 955b518 — 무방향 BFS 와 '부모 방향만'의 차이</title>
<desc id="desc">왼쪽: 지금 구현은 부모 간선을 양방향으로 보고 BFS 한다. 8690126 에서 거리 1 af4e47c, 거리 2 112f66d, 거리 3 955b518 에 닿아 Path: 8690126-&gt;af4e47c-&gt;112f66d-&gt;955b518 을 낸다. 오른쪽: 부모 방향만 허용하면 8690126 에서 af4e47c, 112f66d 까지만 올라가고 옆 가지 955b518 로 내려갈 수 없어 No path 가 된다. 이때 경로는 후손에서 조상 방향으로만 생기고, 조상에서 후손으로 가는 방향도 No path 다.</desc>
