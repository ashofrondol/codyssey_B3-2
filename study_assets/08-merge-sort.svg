<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
<title id="title">머지 정렬 — 반씩 나누고, 합칠 때 같으면 왼쪽 먼저</title>
<desc id="desc">(3,a) (1,b) (3,c) (2,d) (1,e) 다섯 개를 숫자 기준으로 머지 정렬하는 과정. 위쪽 네 줄은 리스트를 반씩 나누고, 아래쪽 세 줄은 두 리스트를 합친다. 마지막 합치기에서 값이 같은 (1,b)·(1,e) 와 (3,a)·(3,c) 는 main.py:48 의 &lt;= 비교 때문에 왼쪽(원래 앞에 있던 것)이 먼저 나와 원래 순서가 유지된다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
