<rect class="bg" x="0" y="0" width="860" height="560"/>

<text class="th" x="24" y="36">머지 정렬 — 반씩 나누고, 합칠 때 같으면 왼쪽 먼저</text>
<text class="ts" x="836" y="36" text-anchor="end">평균·최악 O(n log n) · 추가 메모리 O(n) · 안정</text>
<text class="ts" x="24" y="60">칸 하나 = (정렬 기준 숫자, 이름표) · 붙어 있는 칸 = 한 리스트 · 숫자만 보고 정렬한다</text>

