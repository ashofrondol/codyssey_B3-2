<rect class="bg" x="0" y="0" width="860" height="560"/>

<text class="th" x="24" y="36">역색인 — "커밋 → 단어"를 "단어 → 커밋"으로 뒤집기</text>
<text class="ts" x="24" y="58">보라 = 저장된 데이터 · 노랑 = 이번 검색이 찾은 칸 · 초록 = 출력 · 파랑 = 흐름 (값: 시계를 고정한 재현 실행)</text>

<text class="tb" x="24" y="86">정방향: 커밋 → 메시지</text>
