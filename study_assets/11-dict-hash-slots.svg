<svg xmlns="http://www.w3.org/2000/svg" width="860" height="592" viewBox="0 0 860 592" role="img" aria-labelledby="title desc">
<title id="title">딕셔너리가 키로 값을 찾는 법 — 키 → 해시값 → 칸 번호</title>
<desc id="desc">역색인 keyword_index 의 단어 8개가 16칸짜리 표에 놓인 모습이다. search LOGIN 은 소문자 login 으로 바뀌고, hash(login) 의 끝 4비트인 14 가 칸 번호가 되어 14번 칸을 바로 열고 키를 확인한 뒤 값 [af4e47c, 8690126] 을 돌려준다. fix 는 칸 번호가 3 인데 initial 이 먼저 차지해서 정해진 공식으로 계산한 다음 칸 7 에 들어간다. 칸 번호는 PYTHONHASHSEED=0 으로 고정한 실측값이다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="860" height="592"/>
<text class="th" x="24" y="36">딕셔너리가 키로 값을 찾는 법 — 키 → 해시값 → 칸 번호</text>
<text class="ts" x="24" y="60">초록 = 찾은 값 · 노랑 = 바로 여는 칸 · 주황 = 칸이 겹쳐 다음 칸으로 (충돌)</text>
<rect class="box" x="24" y="84" width="416" height="56" rx="10"/>
<text class="tb" x="40" y="106">① 찾을 키 만들기</text>
<text class="mono" x="40" y="128">search LOGIN → 'LOGIN'.lower() → 'login'</text>
<rect class="box" x="24" y="164" width="416" height="56" rx="10"/>
<text class="tb" x="40" y="186">② 키를 해시값(큰 정수)으로</text>
<text class="mono" x="40" y="208">hash('login') = 6443947830361060766</text>
<rect class="box" x="24" y="244" width="416" height="56" rx="10"/>
<text class="tb" x="40" y="266">③ 칸 번호 = 해시값의 끝 4비트 (표가 16칸)</text>
<text class="mono" x="40" y="288">6443947830361060766 &amp; 15 = 14</text>
<rect class="green" x="24" y="324" width="416" height="76" rx="10"/>
<text class="tb c-green" x="40" y="346">④ 14번 칸을 바로 연다</text>
<text class="ts" x="40" y="368">칸의 키가 'login' 인지 확인한 뒤 값을 돌려준다</text>
<text class="mono" x="40" y="389">['af4e47c', '8690126']</text>
<line class="ln" x1="232" y1="142" x2="232" y2="160" marker-end="url(#arrow)"/>
<line class="ln" x1="232" y1="222" x2="232" y2="240" marker-end="url(#arrow)"/>
<line class="ln" x1="232" y1="302" x2="232" y2="320" marker-end="url(#arrow)"/>
<rect class="orange" x="24" y="440" width="416" height="100" rx="10"/>
<text class="tb c-orange" x="40" y="462">칸이 겹치면 (해시 충돌)</text>
<text class="mono" x="40" y="484">hash('fix') &amp; 15 = 3</text>
<text class="ts" x="40" y="506">3번 칸은 'initial' 이 먼저 차지 → 정해진 공식으로</text>
<text class="ts" x="40" y="527">다음 후보 칸 7 에 넣고, 찾을 때도 3 → 7 로 따라간다</text>
<text class="ts" x="500" y="88" text-anchor="middle">칸</text>
<text class="ts" x="532" y="88">키 (keyword_index 의 단어)</text>
<rect class="box" x="480" y="96" width="300" height="28"/>
<rect class="box" x="480" y="124" width="300" height="28"/>
<rect class="box" x="480" y="152" width="300" height="28"/>
<rect class="box" x="480" y="180" width="300" height="28"/>
<rect class="box" x="480" y="208" width="300" height="28"/>
<rect class="box" x="480" y="236" width="300" height="28"/>
<rect class="box" x="480" y="264" width="300" height="28"/>
<rect class="orange" x="480" y="292" width="300" height="28"/>
<rect class="box" x="480" y="320" width="300" height="28"/>
<rect class="box" x="480" y="348" width="300" height="28"/>
<rect class="box" x="480" y="376" width="300" height="28"/>
<rect class="box" x="480" y="404" width="300" height="28"/>
<rect class="box" x="480" y="432" width="300" height="28"/>
<rect class="box" x="480" y="460" width="300" height="28"/>
<rect class="yellow" x="480" y="488" width="300" height="28"/>
<rect class="box" x="480" y="516" width="300" height="28"/>
<text class="mono c-muted" x="500" y="115" text-anchor="middle">0</text>
<text class="mono" x="532" y="115">'payment'</text>
<text class="mono c-muted" x="500" y="143" text-anchor="middle">1</text>
<text class="mono c-muted" x="500" y="171" text-anchor="middle">2</text>
<text class="mono c-muted" x="500" y="199" text-anchor="middle">3</text>
<text class="mono" x="532" y="199">'initial'</text>
<text class="mono c-muted" x="500" y="227" text-anchor="middle">4</text>
<text class="mono" x="532" y="227">'feature'</text>
<text class="mono c-muted" x="500" y="255" text-anchor="middle">5</text>
<text class="mono" x="532" y="255">'commit'</text>
<text class="mono c-muted" x="500" y="283" text-anchor="middle">6</text>
<text class="mono" x="532" y="283">'add'</text>
<text class="mono c-muted" x="500" y="311" text-anchor="middle">7</text>
<text class="mono" x="532" y="311">'fix'</text>
<text class="ts c-orange" x="580" y="311">3번에서 밀려옴</text>
<text class="mono c-muted" x="500" y="339" text-anchor="middle">8</text>
<text class="mono c-muted" x="500" y="367" text-anchor="middle">9</text>
<text class="mono" x="532" y="367">'bug'</text>
<text class="mono c-muted" x="500" y="395" text-anchor="middle">10</text>
<text class="mono c-muted" x="500" y="423" text-anchor="middle">11</text>
<text class="mono c-muted" x="500" y="451" text-anchor="middle">12</text>
<text class="mono c-muted" x="500" y="479" text-anchor="middle">13</text>
<text class="mono c-muted" x="500" y="507" text-anchor="middle">14</text>
<text class="mono" x="532" y="507">'login' → [af4e47c, 8690126]</text>
<text class="mono c-muted" x="500" y="535" text-anchor="middle">15</text>
<line class="ln" x1="520" y1="96" x2="520" y2="544" style="stroke-width:0.8"/>
<path class="ln ln-green" d="M444,362 L460,362 L460,500 L476,500" marker-end="url(#arrow-green)"/>
<path class="ln ln-orange dash" d="M784,192 L804,192 L804,304 L788,304" marker-end="url(#arrow-orange)"/>
<text class="ts" x="24" y="576">칸 번호: PYTHONHASHSEED=0 으로 hash() 를 실측하고 CPython 의 탐사 공식으로 계산 · 시드가 바뀌면 칸 번호도 바뀐다</text>
</svg>
